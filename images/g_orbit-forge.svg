  <rect x="542" y="18" width="62" height="24" rx="12" fill="#7c8cff" fill-opacity=".13" stroke="#7c8cff" stroke-opacity=".7"/>
  <text x="573" y="34" fill="#7c8cff" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="2">NEW</text>
  
      <g transform="translate(322 42)">
