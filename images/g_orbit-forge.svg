      <stop offset="1" stop-color="#0a1224"/>
    </radialGradient>
    <pattern id="grid-orbit-forge" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#7c8cff" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#bg-orbit-forge)"/>
