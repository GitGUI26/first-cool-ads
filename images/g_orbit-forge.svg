<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Orbit Forge cover art">
  <defs>
    <linearGradient id="bg-orbit-forge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1426"/>
      <stop offset=".58" stop-color="#07101e"/>
      <stop offset="1" stop-color="#03070f"/>
    </linearGradient>
    <radialGradient id="glow-orbit-forge" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c8cff" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#7c8cff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade-orbit-forge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03070f" stop-opacity="0"/>
      <stop offset="1" stop-color="#03070f" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="torch" cx="50%" cy="50%" r="50%">
