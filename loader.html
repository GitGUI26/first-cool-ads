<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Classroom</title>
<style>
  :root {
    --bg: #f6f8fc;
    --surface: #ffffff;
    --line: #e0e3e7;
    --text: #3c4043;
    --muted: #5f6368;
    --blue: #1a73e8;
    --green: #188038;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: "Google Sans", Roboto, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .tb-left, .tb-right { display: flex; align-items: center; gap: 8px; }
  .icon-button {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
  }
  .icon-button svg { width: 22px; height: 22px; }
  .brand {
    margin-left: 4px;
    color: var(--muted);
    font-size: 22px;
    letter-spacing: -0.2px;
  }
  .avatar {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    margin-left: 4px;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
  }
  .layout {
    display: flex;
    height: calc(100% - 64px);
  }
  .sidebar {
    flex: 0 0 256px;
    padding: 12px 8px;
    background: var(--surface);
    border-right: 1px solid var(--line);
  }
  .side-item {
    display: flex;
    align-items: center;
    gap: 20px;
    height: 44px;
    padding: 0 16px;
    border-radius: 0 24px 24px 0;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
  }
  .side-item.is-active {
    background: #e8f0fe;
    color: #1967d2;
  }
  .side-item svg { width: 20px; height: 20px; flex: 0 0 auto; }
  .side-divider { height: 1px; margin: 10px 16px; background: var(--line); }
  .content {
    flex: 1 1 auto;
    min-width: 0;
    padding: 22px 26px;
    overflow: hidden;
  }
  .welcome { margin-bottom: 22px; }
  .welcome-line {
    height: 26px;
    margin-bottom: 9px;
    border-radius: 7px;
    background: linear-gradient(90deg, #e9edf3 25%, #f4f6fa 37%, #e9edf3 63%);
    background-size: 400% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
  }
  .welcome-line.short { width: 34%; height: 15px; }
  .class-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
    max-width: 1120px;
  }
  .class-card {
    overflow: hidden;
    border: 1px solid #dadce0;
    border-radius: 10px;
    background: var(--surface);
  }
  .class-banner {
    position: relative;
    height: 64px;
    padding: 14px 16px;
    color: #fff;
  }
  .class-banner::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 82% 18%, rgba(255, 255, 255, 0.28), transparent 38%),
      linear-gradient(135deg, transparent 30%, rgba(255, 255, 255, 0.12));
  }
  .class-title {
    position: relative;
    z-index: 1;
    max-width: 80%;
    height: 14px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.78);
  }
  .class-sub {
    position: relative;
    z-index: 1;
    width: 45%;
    height: 9px;
    margin-top: 8px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.42);
  }
  .class-body {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
  }
  .class-face {
    width: 40px;
    height: 40px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: linear-gradient(90deg, #e9edf3 25%, #f4f6fa 37%, #e9edf3 63%);
    background-size: 400% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
  }
  .class-lines { flex: 1 1 auto; }
  .class-line {
    height: 9px;
    margin-bottom: 7px;
    border-radius: 4px;
    background: linear-gradient(90deg, #e9edf3 25%, #f4f6fa 37%, #e9edf3 63%);
    background-size: 400% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
  }
  .class-line:last-child { width: 62%; margin-bottom: 0; }
  .progress {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 4;
    height: 3px;
    overflow: hidden;
    background: rgba(26, 115, 232, 0.12);
  }
  .progress::before {
    content: "";
    position: absolute;
    top: 0;
    left: -45%;
    width: 45%;
    height: 100%;
    border-radius: 3px;
    background: var(--blue);
    animation: slide 1.15s ease-in-out infinite;
  }
  .status {
    position: fixed;
    left: 50%;
    bottom: 22px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border: 1px solid #dadce0;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 6px 22px rgba(60, 64, 67, 0.15);
    color: var(--muted);
    font-size: 13px;
    transform: translateX(-50%);
  }
  .spinner {
    width: 15px;
    height: 15px;
    border: 2px solid #d2e3fc;
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.72s linear infinite;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  @keyframes shimmer {
    0% { background-position: 100% 0; }
    100% { background-position: 0 0; }
  }
  @keyframes slide {
    0% { left: -45%; }
    55% { left: 55%; }
    100% { left: 105%; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 760px) {
    .sidebar { display: none; }
    .content { padding: 18px 14px; }
    .class-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .class-banner { height: 46px; padding: 11px 12px; }
    .class-body { padding: 10px 12px; }
    .class-face { width: 30px; height: 30px; }
    .status { bottom: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .welcome-line, .class-face, .class-line, .progress::before, .spinner { animation: none; }
  }
</style>
</head>
<body>
<div class="progress" aria-hidden="true"></div>
<div class="topbar">
  <div class="tb-left">
    <span class="icon-button" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </span>
    <span class="brand">Classroom</span>
  </div>
  <div class="tb-right" aria-hidden="true">
    <span class="icon-button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </span>
    <span class="icon-button">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="6" r="1.7"/><circle cx="12" cy="6" r="1.7"/><circle cx="18" cy="6" r="1.7"/><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/><circle cx="6" cy="18" r="1.7"/><circle cx="12" cy="18" r="1.7"/><circle cx="18" cy="18" r="1.7"/></svg>

</div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
      Calendar
    </div>
    <div class="side-divider"></div>
    <div class="side-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      To-do
    </div>
    <div class="side-item">

      Archived classes

  </nav>
  <main class="content" aria-hidden="true">
    <div class="welcome">
      <div class="welcome-line"></div>
      <div class="welcome-line short"></div>
    </div>
    <div class="class-grid">
      <div class="class-card">
        <div class="class-banner" style="background:#1967d2"><div class="class-title"></div><div class="class-sub"></div></div>
        <div class="class-body"><div class="class-face"></div><div class="class-lines"><div class="class-line"></div><div class="class-line"></div></div></div>
      </div>
      <div class="class-card">
        <div class="class-banner" style="background:#188038"><div class="class-title"></div><div class="class-sub"></div></div>
        <div class="class-body"><div class="class-face"></div><div class="class-lines"><div class="class-line"></div><div class="class-line"></div></div></div>
      </div>
      <div class="class-card">
        <div class="class-banner" style="background:#a142f4"><div class="class-title"></div><div class="class-sub"></div></div>
        <div class="class-body"><div class="class-face"></div><div class="class-lines"><div class="class-line"></div><div class="class-line"></div></div></div>
      </div>
      <div class="class-card">
        <div class="class-banner" style="background:#d93025"><div class="class-title"></div><div class="class-sub"></div></div>
        <div class="class-body"><div class="class-face"></div><div class="class-lines"><div class="class-line"></div><div class="class-line"></div></div></div>
      </div>
      <div class="class-card">
        <div class="class-banner" style="background:#f9ab00"><div class="class-title"></div><div class="class-sub"></div></div>
        <div class="class-body"><div class="class-face"></div><div class="class-lines"><div class="class-line"></div><div class="class-line"></div></div></div>
      </div>
      <div class="class-card">
        <div class="class-banner" style="background:#007b83"><div class="class-title"></div><div class="class-sub"></div></div>
        <div class="class-body"><div class="class-face"></div><div class="class-lines"><div class="class-line"></div><div class="class-line"></div></div></div>
      </div>
    </div>
  </main>
</div>
<div class="status" role="status"><span class="spinner" aria-hidden="true"></span><span>Loading your classroom…</span></div>
<p class="sr-only">Cool Tutoring Hub is loading.</p>
</body>
</html>
