<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROM player</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #070b15; overflow: hidden; }
    #game { width: 100%; height: 100%; }
    #boot-error {
      display: none;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 28px;
      color: #e7edff;
      font: 15px/1.6 system-ui, sans-serif;
      text-align: center;
    }
    #boot-error strong { display: block; margin-bottom: 8px; color: #ffb4bd; }
    #boot-error span { display: block; max-width: 460px; margin: 0 auto; color: #aeb9d6; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot-error" role="alert">
    <strong>The emulator could not start.</strong>
    <span id="boot-error-copy">Check your connection and try again.</span>
  </div>
  <script>
    (function () {
      'use strict';
      var params = new URLSearchParams(location.search);
      var core = params.get('core') || '';
      var rom = params.get('rom') || '';
      var bios = params.get('bios') || '';
      var name = params.get('name') || 'ROM';
      var gameId = Number(params.get('gameId')) || 1;
      var errorBox = document.getElementById('boot-error');
      var errorCopy = document.getElementById('boot-error-copy');

      function fail(message) {
        document.getElementById('game').style.display = 'none';
        errorBox.style.display = 'block';
        errorCopy.textContent = message;
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'emulator-error', message: message }, location.origin);
        }
      }

      if (!core || !rom || !/^[a-zA-Z0-9_]+$/.test(core)) {
        fail('The emulator is missing its core or ROM.');
        return;
      }

      window.EJS_player = '#game';
      window.EJS_core = core;
      window.EJS_gameUrl = rom;
      if (bios) window.EJS_biosUrl = bios;
      window.EJS_gameName = name;
      window.EJS_gameID = gameId;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      window.EJS_language = 'en-US';
      window.EJS_startOnLoaded = true;
      window.EJS_threads = false;
      window.EJS_volume = 0.65;
      window.EJS_color = '#59e3c0';
      window.EJS_backgroundColor = '#070b15';
      window.EJS_defaultOptions = { 'save-state-location': 'browser' };
      window.EJS_ready = function () {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'emulator-ready' }, location.origin);
        }
      };

      window.addEventListener('message', function (event) {
        if (event.origin !== location.origin) return;
        if (!event.data || event.data.type !== 'emulator-pause') return;
        try {
          if (window.EJS_emulator && typeof window.EJS_emulator.pause === 'function') {
            window.EJS_emulator.pause();
          }
        } catch (error) {}
      });

      var script = document.createElement('script');
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      script.onerror = function () {
        fail('EmulatorJS could not be loaded from the CDN. Check your connection and try again.');
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
