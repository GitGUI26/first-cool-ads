<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://rawcdn.githack.com/genizy/web-port/main/undertale-yellow/">
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <link rel="icon" type="x-icon" href="favicon.png">
    <title>UNDERTALE YELLOW</title>
    <style>
      @-webkit-keyframes rotation {
        from {
          -webkit-transform: rotate(0deg);
        }

        to {
          -webkit-transform: rotate(360deg);
        }
      }

      @-moz-keyframes rotation {
        from {
          -moz-transform: rotate(0deg);
        }

        to {
          -moz-transform: rotate(360deg);
        }
      }

      @-o-keyframes rotation {
        from {
          -o-transform: rotate(0deg);
        }

        to {
          -o-transform: rotate(360deg);
        }
      }

      @keyframes rotation {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      html {
        background: #FFFFFF;
      }

      body {
        font-family: arial;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        min-height: fill-available;
        min-height: 100vh; /* Otherwise contents can be covered by an address bar in Safari on iOS 15 */
        min-width: 100vw;
        background: radial-gradient(
          56.63% 56.63% at 50% 43.37%,
          transparent 0%,
          transparent 100%
        );
		background-color: black;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
		place-items: center;
      }

      body.scrollingDisabled {
        overflow: hidden;
      }

      .emscripten {
        padding-right: 0;
        display: block;
      }

      div.emscripten {
        text-align: center;
		font-family: "Lucida Console", Monaco, monospace;
      }

      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        display: none;
        background-color: black;
        position: flex;
        transition: opacity 5s ease-in;
        -webkit-transition: opacity 5s ease-in;
        opacity: 0;
        filter: blur(0) grayscale(0);
        image-rendering: optimizeSpeed;             /* Older versions of FF          */
        image-rendering: -moz-crisp-edges;          /* FF 6.0+                       */
        image-rendering: -webkit-optimize-contrast; /* Safari                        */
        image-rendering: -o-crisp-edges;            /* OS X & Windows Opera (12.02+) */
        image-rendering: pixelated;                 /* Awesome future-browsers       */
        -ms-interpolation-mode: nearest-neighbor;   /* IE                            */
      }

      canvas.active {
        animation-name: fadeIn;
        animation-duration: 2s;
        opacity: 1;
      }

      canvas.paused {
        animation-name: blur;
        animation-duration: 0.5s;
        filter: blur(2px) grayscale(1);
      }

      canvas.unpaused {
        animation-name: none;
      }

      canvas.animatedSizeTransitions {
        transition: width 0.3s ease, height 0.3s ease;
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
        }

        100% {
          opacity: 1;
        }
      }

      @keyframes blur {
        0% {
          filter: blur(0) grayscale(0);
        }

        100% {
          filter: blur(2px) grayscale(1);
        }
      }

      .spinner {
        height: 30px;
        width: 30px;

        -webkit-animation: rotation 0.8s linear infinite;
        -moz-animation: rotation 0.8s linear infinite;
        -o-animation: rotation 0.8s linear infinite;
        animation: rotation 0.8s linear infinite;

        border: 5px solid #bdff00;
        border-top: 5px solid #719900;
        border-radius: 100%;
      }

      #status {
        display: inline-block;
        vertical-align: top;
        font-weight: bold;
        color: white;
      }

      #progress {
        width: 250px;
        height: 10px;
        -webkit-appearance: none;
        appearance: none;
        padding: 5px;
      }

      /* Determines the style of the background of the progress bar */
      progress[value]::-webkit-progress-bar {
        background-color: #8492a6;
        height: 10px;
        border-radius: 15px;
      }
      /* Determines the style of the completed part of the progress bar */
      progress[value]::-webkit-progress-value {
        background-image: -webkit-linear-gradient(left, #719900, #bdff00);
        height: 10px;
        border-radius: 15px;
      }

      div.loading {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }
      div.loading > * {
        padding: 10px;
        margin: 10px;
      }

      .output-container {
        text-align: center;
        margin-top: auto;
      }
      .output-button {
        border: none;
        width: 200px;
        height: 25px;
        margin: 5px;
        border-radius: 5px;
        cursor: pointer;
        background-color: black;
        color: white;
		outline-color: #20c20e;
		outline-style: dashed;
        font-family: "Lucida Console", Monaco, monospace;
      }

      #output {
        display: none;
        height: 200px;
        background-color: black;
        color: white;
        font-family: "Lucida Console", Monaco, monospace;
        outline: none;
        border: none;
        padding: 0;
        width: 100%;
      }

      #message-container {
        display: none;
        min-height: 50px;
        background-color: rgba(20, 20, 20, 0.5);
        outline: none;
        border: none;
        padding: 0;
        width: 100%;
        position: absolute;
        top: 0;
      }

      #messages {
        margin-left: 50px;
        color: white;
        font-family: "Lucida Console", Monaco, monospace;
        outline: none;
        border: none;
        padding: 0;
      }

      img.qrCode {
         opacity: 1.0;
         width: 50%;
         height: 50%;
      }

      #pauseMenuContainer {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #pauseMenuContainer[hidden] {
        display: none !important;
        opacity: 0;
      }

      #pauseMenuBorder {
        background: linear-gradient(135deg, #FA1E4E, transparent 40%);
        padding: 1px;
        border-radius: 4px;
        clip-path: polygon(10.5px 0, 100% 0, 100% 100%, 0 100%, 0 10.5px);
        width: 70vw;
        max-width: 400px;
      }

      #pauseMenu {
        display: flex;
        flex-direction: column;
        padding: 60px 30px 60px 30px;
        background: linear-gradient(180deg, #2E273F 16.15%, rgba(46, 39, 63, 0.79) 56.25%, #2E273F 91.15%);
        border-radius: 4px;
        clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
        animation-name: fadeIn;
        animation-duration: 0.5s;
        opacity: 1;
      }

      #pauseMenu button {
        font-weight: 500;
        font-size: 17px;
        color: white;
        background: #FA1E4E;
        border: 1px solid #FA1E4E;
        border-radius: 6px;
        padding: 12px 24px;
        margin: 5px 0;
        -webkit-user-select: none;
        user-select: none;
      }

      #pauseMenu button#quitButton {
        background: #FA1E4E40;
      }

      #pauseMenu button:hover {
        filter: brightness(1.15);
      }

      #pauseMenu button:active {
        filter: brightness(0.85);
      }

      #pauseMenu button[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas
      class="emscripten"
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="-1"
    >
    </canvas>
    <div id="pauseMenuContainer" hidden>
      <div id="pauseMenuBorder">
        <div id="pauseMenu">
          <button id="resumeButton" onclick="resume()">
            Resume
          </button>
          <button id="quitButton" onclick="quitIfSupported()">
            Quit
          </button>
        </div>
        </div>
    </div>
    <div class="loading">
      <div class="spinner" id="spinner"></div>
      <div class="emscripten" id="status">Downloading...</div>

      <progress value="0" max="100" id="progress" hidden="1"></progress>
    </div>

    <div id="message-container">
      <div id="messages">
      </div>
    </div>
    <script>
      (function () {
        var RAW_BASE = 'https://raw.githubusercontent.com/genizy/web-port/main/undertale-yellow/';
        var MIRROR_BASE = 'https://rawcdn.githack.com/genizy/web-port/main/undertale-yellow/';
        var PART_COUNT = 12;
        var CONCURRENCY = 4;
        var parts = [];
        for (var i = 1; i <= PART_COUNT; i++) {
          parts.push([RAW_BASE + 'game.unx.part' + i, MIRROR_BASE + 'game.unx.part' + i]);
        }

        var partBlobs = new Array(PART_COUNT);
        var loaded = 0;
        var total = 0;
        var statusEl = document.getElementById('status');
        var progressEl = document.getElementById('progress');
        var loadingEl = document.querySelector('.loading');

        function mb(n) { return (n / 1048576).toFixed(1); }

        function render() {
          if (total) {
            var pct = Math.min(100, Math.round((loaded / total) * 100));
            progressEl.hidden = false;
            progressEl.value = pct;
            statusEl.textContent = 'Downloading\u2026 ' + mb(loaded) + ' MB / ' + mb(total) + ' MB (' + pct + '%)';
          } else {
            statusEl.textContent = 'Downloading\u2026 ' + mb(loaded) + ' MB';
          }
        }

        function headSize(urls, index) {
          index = index || 0;
          if (index >= urls.length) return Promise.resolve(0);
          return new Promise(function (resolve) {
            var settled = false;
            var controller = new AbortController();
            var timer = setTimeout(function () {
              if (!settled) { settled = true; controller.abort(); resolve(0); }
            }, 8000);
            fetch(urls[index], { method: 'HEAD', cache: 'force-cache', signal: controller.signal }).then(function (res) {
              if (settled) return;
              settled = true;
              clearTimeout(timer);
              if (res.ok && res.headers.get('content-length')) {
                resolve(Number(res.headers.get('content-length')) || 0);
              } else {
                resolve(headSize(urls, index + 1));
              }
            }).catch(function () {
              if (!settled) { settled = true; clearTimeout(timer); resolve(headSize(urls, index + 1)); }
            });
          });
        }

        function fetchPart(urls, attempt) {
          attempt = attempt || 0;
          var url = urls[attempt % urls.length];
          return new Promise(function (resolve, reject) {
            var controller = new AbortController();
            var timer = setTimeout(function () { controller.abort(); }, 45000);
            fetch(url, { cache: 'force-cache', signal: controller.signal }).then(function (res) {
              if (!res.ok) throw new Error('HTTP ' + res.status);
              var reader = res.body.getReader();
              var chunks = [];
              function pump() {
                return reader.read().then(function (step) {
                  if (step.done) return new Blob(chunks);
                  chunks.push(step.value);
                  loaded += step.value.length;
                  render();
                  return pump();
                });
              }
              return pump();
            }).then(function (blob) {
              clearTimeout(timer);
              resolve(blob);
            }).catch(function (error) {
              clearTimeout(timer);
              if (attempt < 3) {
                setTimeout(function () {
                  fetchPart(urls, attempt + 1).then(resolve, reject);
                }, 800 * (attempt + 1));
              } else {
                reject(error);
              }
            });
          });
        }

        function start() {
          render();
          return Promise.all(parts.map(function (urls) { return headSize(urls); })).then(function (sizes) {
            total = sizes.reduce(function (a, b) { return a + b; }, 0);
            render();
            var next = 0;
            var workers = [];
            for (var w = 0; w < CONCURRENCY; w++) {
              workers.push((function run() {
                if (next >= parts.length) return Promise.resolve();
                var index = next++;
                return fetchPart(parts[index]).then(function (blob) {
                  partBlobs[index] = blob;
                  render();
                  return run();
                });
              })());
            }
            return Promise.all(workers);
          }).then(function () {
            var merged = new Blob(partBlobs);
            window.gameUnxUrl = URL.createObjectURL(merged);
            window.__uyBytes = loaded;

            function mapAsset(url) {
              if (typeof url !== 'string') return url;
              if (url.indexOf('game.unx') !== -1) return window.gameUnxUrl;
              if (url.indexOf('runner.data') !== -1) return RAW_BASE + 'runner.data';
              if (url.indexOf('runner.wasm') !== -1) return RAW_BASE + 'runner.wasm';
              return url;
            }

            var originalFetch = window.fetch;
            window.fetch = function (input, init) {
              if (typeof input === 'string' || input instanceof URL) {
                input = mapAsset(String(input));
              } else if (input instanceof Request) {
                var mapped = mapAsset(input.url);
                if (mapped !== input.url) input = new Request(mapped, input);
              }
              return originalFetch.call(this, input, init);
            };

            var originalOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function (method, url) {
              var mapped = mapAsset(String(url));
              if (mapped !== url) arguments[1] = mapped;
              return originalOpen.apply(this, arguments);
            };

            function loadScript(name) {
              return fetch(RAW_BASE + name).then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.text();
              }).then(function (code) {
                return new Promise(function (resolve, reject) {
                  var script = document.createElement('script');
                  script.src = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
                  script.onload = resolve;
                  script.onerror = reject;
                  document.body.appendChild(script);
                });
              }).catch(function () {
                return new Promise(function (resolve, reject) {
                  var script = document.createElement('script');
                  script.src = name;
                  script.onload = resolve;
                  script.onerror = reject;
                  document.body.appendChild(script);
                });
              });
            }

            loadScript('index.js').then(function () {
              return loadScript('runner.js');
            }).catch(function (error) {
              console.error('Failed to start game:', error);
              statusEl.textContent = 'Download failed. Tap here to retry.';
            });
          });
        }

        start().catch(function (error) {
          console.error('Failed to download game data:', error);
          statusEl.textContent = 'Download failed. Tap here to retry.';
          if (loadingEl) {
            loadingEl.style.pointerEvents = 'auto';
            loadingEl.style.cursor = 'pointer';
            loadingEl.addEventListener('click', function () { location.reload(); });
          }
        });
      })();
  </script>
  </body>
</html>
