<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>1v1.LOL</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #e8eaf0;
    }

    #gameContainer {
      position: fixed;
      inset: 0;
      background: #000;
    }

    #gameContainer canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      background: radial-gradient(circle at 50% 20%, #101a33 0%, #05070c 70%);
      text-align: center;
    }

    #loader .title {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: .08em;
    }

    #loader .spinner {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .15);
      border-top-color: #7c8cff;
      animation: spin 1s linear infinite;
    }

    #loader .progress {
      width: min(360px, 70vw);
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .12);
      overflow: hidden;
    }

    #loader .progress .full {
      width: 100%;
      height: 100%;
      background: #7c8cff;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform .2s ease;
    }

    #loader .status {
      margin: 0;
      max-width: min(460px, 85vw);
      font-size: .85rem;
      line-height: 1.55;
      color: #9aa4bd;
    }

    #loader.failed .spinner,
    #loader.failed .progress {
      display: none;
    }

    #loader.failed .status {
      color: #ffb4b4;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="gameContainer"></div>

  <div id="loader">
    <div class="title">1v1.LOL</div>
    <div class="spinner"></div>
    <div class="progress">
      <div class="full"></div>
    </div>
    <p class="status" id="loaderStatus">Loading game files. The outdated ad-gated loader that used to hang here is gone; this
      page loads a community mirror of the retired 1v1.LOL client.</p>
  </div>

  <script src="1v1lol-loader.js"></script>
  <script>
    // The Unity client calls back into the host page for account, ad-gate and
    // fullscreen hooks. The original 1v1.lol site supplied these from its own
    // Firebase and ad bundles; this page supplies offline-safe replacements so
    // the engine never throws on a missing global.
    function onUnityReady() {}

    function firebaseLogin(provider, onSuccess, onError) {
      if (typeof onError === 'function') onError('Account sign-in is unavailable in this offline mirror.');
    }

    function firebaseLogout(onSuccess) {
      if (typeof onSuccess === 'function') onSuccess();
    }

    function retrieveIdToken(onSuccess, onError) {
      if (typeof onError === 'function') onError('Account sign-in is unavailable in this offline mirror.');
    }

    function showAds() {}

    function hideAds() {}
  </script>
  <script>
    (function () {
      var BUILD_MANIFEST = '1v1lol-build.json';
      var loader = document.getElementById('loader');
      var status = document.getElementById('loaderStatus');
      var bar = loader.querySelector('.full');
      var finished = false;
      var watchdog = null;

      function setProgress(value) {
        var ratio = Math.max(0, Math.min(1, Number(value) || 0));
        bar.style.transform = 'scaleX(' + ratio + ')';
        armWatchdog();
      }

      function fail(message) {
        if (finished) return;
        clearTimeout(watchdog);
        loader.classList.add('failed');
        status.textContent = message;
      }

      function armWatchdog() {
        clearTimeout(watchdog);
        watchdog = setTimeout(function () {
          fail('The game files stopped downloading. Check your connection and reload the page.');
        }, 45000);
      }

      function boot() {
        if (typeof UnityLoader === 'undefined' || typeof UnityLoader.instantiate !== 'function') {
          fail('The Unity loader could not start in this browser.');
          return;
        }

        var gameInstance;
        try {
          gameInstance = UnityLoader.instantiate('gameContainer', BUILD_MANIFEST, {
            onProgress: function (instance, progress) {
              setProgress(progress);
              if (progress >= 1 && !finished) {
                finished = true;
                clearTimeout(watchdog);
                loader.style.display = 'none';
              }
            }
          });
        }
        catch (error) {
          fail('The game could not start: ' + (error && error.message ? error.message : 'unknown error'));
          return;
        }

        window.unityInstance = gameInstance;
        window.gameInstance = gameInstance;
        armWatchdog();

        var pointerLocked = false;
        document.addEventListener('pointerlockchange', function () {
          if (!pointerLocked && document.pointerLockElement) pointerLocked = true;
          if (!document.pointerLockElement && pointerLocked) {
            pointerLocked = false;
            try {
              gameInstance.SendMessage('Pause Menu', 'OnCursorUnlocked');
            }
            catch (error) {}
          }
        }, false);
      }

      armWatchdog();
      boot();
    })();
  </script>
</body>

</html>
