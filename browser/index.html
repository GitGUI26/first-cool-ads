<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Home | Rowan County Schools</title>
<link rel="icon" href="../cuh.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://site-f38c0cecdb6f42f890f9ef76a1463c3c.freebuff.page" crossorigin>
<link rel="preconnect" href="https://site-f38c0cecdb6f42f890f9ef76a1463c3c.freebuff.page">

<style>
:root {
  --bg: #060a14;
  --bar: rgba(9, 14, 27, 0.82);
  --fg: #eef2ff;
  --mut: #96a0c0;
  --acc: #7c8cff;
  --acc-rgb: 124, 140, 255;
  --acc2: #22d3ee;
  --line: rgba(158, 174, 255, 0.15);
  --line-strong: rgba(158, 174, 255, 0.3);
  --surface: rgba(255, 255, 255, 0.04);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --display: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--font);
  overflow: hidden;
}
button, input { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible {
  outline: 2px solid var(--acc2);
  outline-offset: 2px;
}
#app { display: flex; flex-direction: column; height: 100%; background: radial-gradient(ellipse 55% 50% at 20% 0%, rgba(var(--acc-rgb), 0.1), transparent 72%), radial-gradient(ellipse 50% 55% at 100% 100%, rgba(34, 211, 238, 0.06), transparent 72%), var(--bg); }
#tabs { display: flex; align-items: flex-end; gap: 4px; flex: 0 0 auto; padding: 10px 12px 0; overflow-x: auto; background: rgba(6, 11, 22, 0.72); border-bottom: 1px solid var(--line); scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; display: flex; align-items: center; gap: 8px; min-width: 104px; max-width: 220px; padding: 9px 11px; border: 1px solid transparent; border-bottom: 0; border-radius: 12px 12px 0 0; background: rgba(255, 255, 255, 0.025); color: var(--mut); cursor: pointer; white-space: nowrap; transition: color 0.18s ease, background 0.18s ease, border-color 0.18s ease; }
.tab::before { content: ''; width: 6px; height: 6px; flex: 0 0 auto; border-radius: 50%; background: currentColor; opacity: 0.5; }
.tab.on { color: var(--fg); border-color: var(--line); background: rgba(255, 255, 255, 0.07); }
.tab.on::before { background: var(--acc2); opacity: 1; box-shadow: 0 0 10px rgba(34, 211, 238, 0.5); }
.tab span { flex: 1; overflow: hidden; text-align: left; text-overflow: ellipsis; }
.tab b { padding: 2px 4px; border-radius: 4px; opacity: 0.45; font-weight: 400; }
.tab b:hover { background: rgba(255, 255, 255, 0.08); opacity: 1; }
#plus { align-self: center; padding: 4px 11px; color: var(--mut); cursor: pointer; font-size: 19px; line-height: 1; }
#plus:hover { color: var(--fg); }
#bar { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; padding: 10px 12px; background: var(--bar); border-bottom: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.browser-controls { display: flex; gap: 4px; flex: 0 0 auto; }
#bar button { width: 34px; height: 34px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--mut); font-size: 15px; transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease; }
#bar button:hover { color: var(--fg); border-color: var(--line-strong); background: rgba(255, 255, 255, 0.08); }
.address-wrap { position: relative; display: flex; align-items: center; flex: 1; min-width: 0; }
.address-mark { position: absolute; left: 13px; z-index: 1; color: var(--acc2); font-size: 15px; line-height: 1; pointer-events: none; }
#url { width: 100%; height: 38px; padding: 0 14px 0 34px; border: 1px solid var(--line); border-radius: 11px; background: rgba(255, 255, 255, 0.045); color: var(--fg); font: 13px/1.4 var(--font); outline: none; transition: border-color 0.18s ease, background 0.18s ease; }
#url::placeholder { color: var(--mut); opacity: 0.8; }
#url:focus { border-color: rgba(var(--acc-rgb), 0.62); background: rgba(255, 255, 255, 0.07); }
#back2site { margin-left: 2px; padding: 7px 8px; color: var(--mut); font: 600 10px/1 var(--display); letter-spacing: 0.1em; text-decoration: none; text-transform: uppercase; white-space: nowrap; }
#back2site:hover { color: var(--fg); }
#notice { display: none; padding: 9px 14px; background: rgba(255, 193, 114, 0.1); border-bottom: 1px solid rgba(255, 193, 114, 0.2); color: #ffd08a; font-size: 12px; }
#notice.bad { background: rgba(255, 120, 120, 0.1); border-bottom-color: rgba(255, 120, 120, 0.18); color: #ffbcbc; }
#notice a { color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
#views { position: relative; flex: 1; min-height: 0; background: #fff; }
#views iframe { position: absolute; inset: 0; display: none; width: 100%; height: 100%; border: 0; background: #fff; }
#views iframe.on { display: block; }
#home { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 18px; overflow-y: auto; padding: clamp(24px, 4vw, 54px); background: radial-gradient(ellipse 55% 50% at 50% 0%, rgba(var(--acc-rgb), 0.11), transparent 68%), radial-gradient(ellipse 45% 45% at 90% 100%, rgba(34, 211, 238, 0.06), transparent 72%), var(--bg); text-align: center; }
#home.on { display: flex; }
.home-eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--acc2); font: 600 10px/1.2 var(--display); letter-spacing: 0.18em; text-transform: uppercase; }
.home-pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--acc2); box-shadow: 0 0 14px rgba(34, 211, 238, 0.75); }
#home h1 { margin: 0; color: var(--fg); font: 600 clamp(2rem, 4vw, 3rem)/1.05 var(--display); letter-spacing: -0.035em; }
#home > p { max-width: 560px; margin: 0; color: var(--mut); font-size: 13px; line-height: 1.7; }
#home .home-note { max-width: 520px; color: var(--mut); font-size: 11px; opacity: 0.65; }
.q { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 2px 0; }
.q a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); cursor: pointer; font-size: 12px; text-decoration: none; transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease; }
.q a:hover { border-color: rgba(var(--acc-rgb), 0.55); background: rgba(var(--acc-rgb), 0.1); transform: translateY(-1px); }
@media (max-width: 620px) {
  #tabs { padding: 8px 8px 0; }
  .tab { min-width: 92px; max-width: 46vw; padding: 8px 9px; font-size: 12px; }
  #bar { gap: 7px; padding: 8px; }
  #bar button { width: 32px; height: 32px; }
  #url { height: 36px; padding-left: 31px; font-size: 12px; }
  .address-mark { left: 11px; font-size: 13px; }
  #home { gap: 15px; padding: 26px 18px; }
  #home h1 { font-size: 2rem; }
  #home > p { font-size: 12px; }
  #home .home-note { display: none; }
}
</style>
</head>
<body>
<div id="app">
  <div id="tabs" aria-label="Browser tabs"></div>
  <div id="bar">
    <div class="browser-controls">
      <button id="bk" type="button" title="Back" aria-label="Back">&#8592;</button>
      <button id="fw" type="button" title="Forward" aria-label="Forward">&#8594;</button>
      <button id="rl" type="button" title="Reload" aria-label="Reload">&#8635;</button>
      <button id="hm" type="button" title="Home" aria-label="Home">&#8962;</button>
    </div>
    <div class="address-wrap">
      <span class="address-mark" aria-hidden="true">&#9906;</span>
      <input id="url" placeholder="Search or enter address" spellcheck="false" autocomplete="off" aria-label="Search or enter address">
    </div>
    <a id="back2site" href="../">&#8592; Site</a>
  </div>
  <div id="notice" role="status"></div>
  <div id="views">
    <div id="home" class="on">
      <div class="home-eyebrow"><span class="home-pulse"></span>COOL / PRIVATE SESSION</div>
      <h1>Private Browser</h1>
      <p>Pages are fetched by the site's edge proxy, so websites see the proxy rather than your device. Cookies and referrers are stripped.</p>
      <div class="q">
        <a data-go="https://duckduckgo.com/html/">DuckDuckGo</a>
        <a data-go="https://www.wikipedia.org/">Wikipedia</a>
        <a data-go="https://news.ycombinator.com/">Hacker News</a>
        <a data-go="https://example.com/">example.com</a>
      </div>
      <p class="home-note">It is not a VPN: the proxy operator can see what you browse.</p>
    </div>
  </div>
</div>
<script>
const SEARCH = 'https://html.duckduckgo.com/html/?q=';
const PROXY = 'https://site-f38c0cecdb6f42f890f9ef76a1463c3c.freebuff.page';
const $ = (s) => document.querySelector(s);
let tabs = [], cur = null, uid = 0, online = true, fallback = false;
const HEALTH_TIMEOUT = 6000;
const HEALTH_ATTEMPTS = 3;
const FALLBACK = 'https://www.4everproxy.com/';
const FALLBACK_QUERY = 'https://www.4everproxy.com/query';

function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

async function readProxyHealth() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), HEALTH_TIMEOUT);
  try {
    const res = await fetch(PROXY + '/p/health?t=' + Date.now(), {
      cache: 'no-store',
      signal: controller.signal
    });
    if (!res.ok) throw new Error('Health check returned ' + res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}

function applyParentTheme() {
  try {
    if (window.parent === window) return;
    const parentStyle = window.parent.getComputedStyle(window.parent.document.documentElement);
    const root = document.documentElement;
    const mappings = {
      '--bg': ['--dark-bg', '--ui-surface-solid'],
      '--bar': ['--ui-surface', '--ui-surface-solid'],
      '--fg': ['--ui-text', '--light-text'],
      '--mut': ['--ui-muted', '--gray-text'],
      '--acc': ['--primary-accent'],
      '--acc-rgb': ['--primary-accent-rgb'],
      '--acc2': ['--accent'],
      '--line': ['--ui-line'],
      '--line-strong': ['--ui-line-strong'],
      '--font': ['--font-body'],
      '--display': ['--font-display']
    };
    Object.entries(mappings).forEach(([target, sources]) => {
      for (const source of sources) {
        const value = parentStyle.getPropertyValue(source).trim();
        if (value) {
          root.style.setProperty(target, value);
          break;
        }
      }
    });
  } catch (error) {}
}

function enc(u) { return PROXY + '/p?u=' + encodeURIComponent(u); }
function norm(v) {
  v = v.trim();
  if (!v) return '';
  if (/^[a-z]+:\/\//i.test(v)) return v;
  if (/^[\w-]+(\.[\w-]+)+((:\d+)?(\/.*)?)$/.test(v) && !/\s/.test(v)) return 'https://' + v;
  return SEARCH + encodeURIComponent(v);
}
function notice(t, bad, withFallback) {
  const n = $('#notice');
  n.textContent = t || '';
  if (withFallback) {
    const a = document.createElement('a');
    a.href = FALLBACK;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = 'Open public browser';
    n.append(' ', a);
  }
  n.className = bad ? 'bad' : '';
  n.style.display = t ? 'block' : 'none';
}
function openFallback(url) {
  const win = window.open('about:blank', '_blank');
  if (!win) return false;
  const doc = win.document;
  doc.open();
  doc.write('<!doctype html><title>Opening public fallback…</title><body style="margin:0;background:#060a14;color:#eef2ff;font:14px sans-serif">Opening public fallback…</body>');
  doc.close();
  const form = doc.createElement('form');
  form.method = 'POST';
  form.action = FALLBACK_QUERY;
  const fields = {
    u: url,
    u_default: 'https://www.google.com/',
    customip: '',
    server_name: 'qc',
    selip: 'random',
    allowCookies: 'on'
  };
  Object.entries(fields).forEach(([name, value]) => {
    const input = doc.createElement('input');
    input.type = 'hidden';
    input.name = name;
    input.value = value;
    form.appendChild(input);
  });
  doc.body.appendChild(form);
  form.submit();
  try { win.opener = null; } catch (error) {}
  return true;
}
function newTab(url) {
  const t = { id: ++uid, title: 'New tab', url: '', frame: document.createElement('iframe') };
  t.frame.setAttribute('referrerpolicy', 'no-referrer');
  $('#views').appendChild(t.frame);
  tabs.push(t);
  select(t);
  if (url) go(url);
  return t;
}
function select(t) {
  cur = t;
  tabs.forEach(x => x.frame.classList.toggle('on', x === t && !!x.url));
  $('#home').classList.toggle('on', !t.url);
  $('#url').value = t.url;
  draw();
}
function draw() {
  const el = $('#tabs');
  el.innerHTML = '';
  tabs.forEach(t => {
    const d = document.createElement('div');
    d.className = 'tab' + (t === cur ? ' on' : '');
    d.innerHTML = '<span></span><b>&#10005;</b>';
    d.firstChild.textContent = t.title;
    d.onclick = () => select(t);
    d.lastChild.onclick = e => { e.stopPropagation(); close(t); };
    el.appendChild(d);
  });
  const p = document.createElement('div');
  p.id = 'plus';
  p.textContent = '+';
  p.onclick = () => newTab();
  el.appendChild(p);
}
function close(t) {
  t.frame.remove();
  tabs = tabs.filter(x => x !== t);
  if (!tabs.length) newTab();
  else if (cur === t) select(tabs[tabs.length - 1]);
  else draw();
}
function go(raw) {
  if (!cur) return;
  const u = norm(raw);
  if (!u) return;
  if (fallback) {
    const opened = openFallback(u);
    notice(opened
      ? 'Private proxy is blocked here. Opened this site in the public fallback tab.'
      : 'Private proxy is blocked here. Open the public fallback tab to continue.', !opened, true);
    return;
  }
  if (!online) {
    notice('Proxy service not reachable. Try again in a moment.', true);
    return;
  }
  cur.url = u;
  cur.title = u.replace(/^https?:\/\//, '').split('/')[0];
  cur.frame.src = enc(u);
  select(cur);
}
addEventListener('message', e => {
  if (!e.data || e.data.type !== 'proxy-nav') return;
  const t = tabs.find(x => x.frame.contentWindow === e.source);
  if (!t) return;
  t.url = e.data.url;
  if (e.data.title) t.title = e.data.title;
  if (t === cur) $('#url').value = t.url;
  draw();
});
$('#url').addEventListener('keydown', e => {
  if (e.key === 'Enter') go($('#url').value);
});
$('#bk').onclick = () => { try { cur.frame.contentWindow.history.back(); } catch (e) {} };
$('#fw').onclick = () => { try { cur.frame.contentWindow.history.forward(); } catch (e) {} };
$('#rl').onclick = () => { if (cur && cur.url) cur.frame.src = enc(cur.url); };
$('#hm').onclick = () => {
  cur.url = '';
  cur.title = 'New tab';
  cur.frame.src = 'about:blank';
  select(cur);
};
document.querySelectorAll('[data-go]').forEach(a => a.onclick = () => go(a.dataset.go));
addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
    e.preventDefault();
    $('#url').select();
  }
});
async function boot() {
  newTab();
  for (let attempt = 1; attempt <= HEALTH_ATTEMPTS; attempt++) {
    try {
      const r = await readProxyHealth();
      online = r.ok !== false;
      fallback = false;
      if (r.locked && !r.authed) {
        const k = prompt('Access key for the proxy:');
        if (k) {
          const l = await fetch(PROXY + '/p/login?k=' + encodeURIComponent(k));
          if (!l.ok) {
            notice('Wrong access key.', true);
            online = false;
          }
        } else {
          online = false;
          notice('Access key required.', true);
        }
      }
      if (!online) {
        fallback = true;
        online = true;
        notice('Private proxy is blocked on this network. Use the public fallback to continue.', false, true);
      }
      return;
    } catch (e) {
      if (attempt < HEALTH_ATTEMPTS) await sleep(650 * attempt);
    }
  }
  // The private host can be blocked by a local network even when the backend is
  // healthy. CroxyProxy refuses to run in an iframe, so its fallback opens as a
  // top-level tab instead.
  fallback = true;
  online = true;
  notice('Private proxy is blocked on this network. Use the public fallback to continue.', false, true);
}
try {
  if (window.parent !== window) {
    const back = document.getElementById('back2site');
    if (back) back.style.display = 'none';
    addEventListener('keydown', e => {
      if (e.key === 'Escape') parent.postMessage({ type: 'proxy-close' }, '*');
    });
  }
} catch (e) {}
applyParentTheme();
boot();
</script>
</body>
